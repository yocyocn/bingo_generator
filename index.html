<!DOCTYPE html>
<html lang="ja" data-theme="white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Bingo Generator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="main-wide">
    <h1 class="page-title">Bingo Generator</h1>

    <form id="create-form" class="create-layout" novalidate>
      <div class="card form create-fields">
        <div class="field">
          <label for="title">ビンゴ名</label>
          <input type="text" id="title" maxlength="40" placeholder="例：おさんぽあるある" autocomplete="off">
        </div>

        <div class="field">
          <label for="size">マスの数</label>
          <select id="size">
            <option value="3">3 × 3</option>
            <option value="4">4 × 4</option>
            <option value="5" selected>5 × 5</option>
          </select>
        </div>

        <div class="field" id="free-field">
          <div class="toggle-row">
            <label class="toggle" for="free-toggle">
              <input type="checkbox" id="free-toggle" role="switch" checked>
              <span class="toggle-track" aria-hidden="true"></span>
              <span class="toggle-label">中央をFREEマスにする</span>
            </label>
          </div>
          <div class="free-text-field" id="center-text-field" hidden>
            <label for="center-text" class="sub-label">中央マスの項目 <span class="label-note">２０文字まで</span></label>
            <input type="text" id="center-text" placeholder="例：くつをはいて外に出る" autocomplete="off">
          </div>
        </div>

        <div class="field">
          <label for="items">ビンゴの項目 <span class="label-note">１マス２０文字まで</span></label>
          <textarea id="items" rows="10" placeholder="例：&#10;犬とすれ違う&#10;塀の上に猫がいる&#10;どこかの家からカレーの匂い&#10;知らない道に入ってみる&#10;自販機で飲み物を買う"></textarea>
          <div class="items-meta">
            <span id="items-count"></span>
          </div>
          <ul class="field-error-list" id="items-error"></ul>
        </div>

        <fieldset class="field field-last">
          <legend>カラー</legend>
          <div class="theme-picker" id="theme-picker"></div>
        </fieldset>
      </div>

      <section class="create-preview" aria-labelledby="preview-heading">
        <h2 class="preview-heading" id="preview-heading">プレビュー</h2>
        <p class="preview-title" id="preview-title"></p>
        <div class="board" id="preview-board" role="group" aria-label="ビンゴカードのプレビュー"></div>
      </section>

      <div class="create-actions">
        <button type="button" class="button button-block" id="try-play">
          遊んでみる
          <svg class="button-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>
          </svg>
          <span class="visually-hidden">（新しいタブで開きます）</span>
        </button>
        <button type="submit" class="button button-primary button-block">シェア</button>
      </div>
    </form>
  </main>

  <script src="js/common.js"></script>
  <script src="js/create.js"></script>
</body>
</html>
