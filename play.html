<!DOCTYPE html>
<html lang="ja" data-theme="white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>ビンゴで遊ぶ | Bingo Generator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1 class="page-title" id="bingo-title"></h1>
    <p class="page-lead">当てはまるマスをタップして ○ をつけよう</p>

    <div class="board" id="board" role="group" aria-label="ビンゴカード"></div>

    <p class="bingo-count" id="bingo-count" role="status" hidden></p>

    <div class="card form comment-field">
      <label for="comment">コメント <span class="label-note">100文字まで</span></label>
      <textarea id="comment" rows="3" maxlength="100" placeholder="コメントをどうぞ"></textarea>
      <p class="items-meta" id="comment-count"></p>
    </div>

    <div class="actions">
      <button type="button" class="button button-primary button-block" id="share-result">結果をシェア</button>
    </div>

    <a class="button button-block create-button" href="index.html">ビンゴを作ってみる</a>
  </main>

  <script src="js/common.js"></script>
  <script src="js/play.js"></script>
</body>
</html>
